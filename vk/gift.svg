<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="boxFace" x1="0" y1="110" x2="0" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ece7f2"/>
    </linearGradient>
    <linearGradient id="lidFace" x1="0" y1="72" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f0f8"/>
    </linearGradient>
    <linearGradient id="band" x1="100" y1="70" x2="140" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc846"/>
      <stop offset="1" stop-color="#f0a015"/>
    </linearGradient>
    <linearGradient id="bow" x1="60" y1="20" x2="180" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f0a015"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#2b2430" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <!-- Хвосты ленты уходят под крышку — иначе бант висит в воздухе. -->
    <path d="M112 72 L86 104 L104 96 L110 82 Z" fill="#e0940f"/>
    <path d="M128 72 L154 104 L136 96 L130 82 Z" fill="#e0940f"/>

    <!-- Коробка: корпус и крышка с разной светлотой дают объём. -->
    <rect x="42" y="108" width="156" height="98" rx="12" fill="url(#boxFace)"/>
    <rect x="34" y="74" width="172" height="38" rx="11" fill="url(#lidFace)"/>
    <rect x="34" y="106" width="172" height="6" fill="#d9d2e4" opacity="0.7"/>

    <!-- Вертикальная лента поверх обеих частей. -->
    <rect x="104" y="74" width="32" height="132" fill="url(#band)"/>
    <rect x="104" y="74" width="8" height="132" fill="#ffffff" opacity="0.22"/>

    <!-- Бант: две петли и узел. Петли объёмные, с тёмной изнанкой. -->
    <path d="M120 70 C 92 26, 46 34, 56 62 C 62 78, 98 80, 120 70 Z" fill="url(#bow)"/>
    <path d="M120 70 C 148 26, 194 34, 184 62 C 178 78, 142 80, 120 70 Z" fill="url(#bow)"/>
    <path d="M120 70 C 104 56, 82 54, 70 60 C 86 70, 106 72, 120 70 Z" fill="#e0940f" opacity="0.55"/>
    <path d="M120 70 C 136 56, 158 54, 170 60 C 154 70, 134 72, 120 70 Z" fill="#e0940f" opacity="0.55"/>
    <ellipse cx="120" cy="70" rx="17" ry="14" fill="#ffd166"/>
    <ellipse cx="120" cy="67" rx="11" ry="8" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
